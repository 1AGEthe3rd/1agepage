<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>1AGE Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
<button class="brand" data-screen="home"><img src="1age-logo.png" alt="1AGE"><span>PAGE</span></button>
<button class="mini">1J</button>
</header>
<main>
<section id="home" class="screen active">
<div class="identity">
<div class="avatar-wrap"><div class="avatar big">1J</div><i class="online"></i></div>
<h1>1AGE James</h1><p class="handle">@james</p><p class="bio">Building 1AGE.</p>
<button class="pill">EDIT PAGE</button>
</div>
<div class="tiles">
<button class="tile live" data-screen="messages"><span class="icon">••</span><b class="badge">4</b><strong>Messages</strong><small>New conversations</small></button>
<button class="tile" data-screen="discover"><span class="icon">⌕</span><strong>Discover</strong><small>Find Pages</small></button>
<button class="tile"><span class="icon">◇</span><strong>Saved</strong><small>12 items</small></button>
<button class="tile"><span class="icon">↗</span><strong>Activity</strong><small>Recent</small></button>
</div>
<div class="identity-card"><span class="eyebrow dark">YOUR IDENTITY</span><h2>Across 1AGE</h2><div class="orb"></div><div class="chips"><span>EXCHANGE</span><span>QUEST</span><span>GAMES</span><span>SPACE</span></div></div>
<div class="settings">
<button><span>Wallet</span><small>Not connected</small><b>›</b></button>
<button><span>Page settings</span><small>Public</small><b>›</b></button>
<button><span>1AGE+</span><small>Free</small><b>›</b></button>
</div>
</section>

<section id="discover" class="screen">
<div class="screen-head"><button class="back" data-screen="home">‹</button><div><span class="eyebrow">DISCOVER</span><h1>Find a Page</h1></div></div>
<div class="search"><span>⌕</span><input id="searchInput" placeholder="Name, @username, skill..."></div>
<div id="results" class="results"></div>
</section>

<section id="profile" class="screen">
<div class="screen-head"><button class="back" data-screen="discover">‹</button><div><span class="eyebrow">PAGE</span><h1>Profile</h1></div></div>
<div id="profileBody"></div>
</section>

<section id="messages" class="screen">
<div class="screen-head"><button class="back" data-screen="home">‹</button><div><span class="eyebrow">INBOX</span><h1>Messages</h1></div></div>
<div class="tabs"><button class="on">ALL</button><button>PAGE</button><button>EXCHANGE</button><button>SPACE</button></div>
<div id="inbox" class="inbox"></div>
</section>
</main>

<nav class="dock">
<button data-screen="home" class="active"><span>⌂</span><small>Page</small></button>
<button data-screen="discover"><span>⌕</span><small>Discover</small></button>
<button data-screen="messages" class="dockmsg"><span>••</span><i></i><small>Messages</small></button>
</nav>
</div>
<script src="app.js"></script>
</body></html>
